<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AR Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    background-color: #F2E8D5;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(214,97,74,0.04) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(110,142,130,0.05) 0%, transparent 40%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px;
    color: #3B2A20;
  }

  .screen { display: none; width: 100%; max-width: 400px; }
  .screen.active { display: block; }

  /* ===== Auth card, styled like an open scrapbook page ===== */
  .album-card {
    background: #FFFDF8;
    border-radius: 4px;
    padding: 40px 32px 36px;
    box-shadow:
      0 1px 2px rgba(59,42,32,0.06),
      0 12px 28px rgba(59,42,32,0.14);
    position: relative;
    transform: rotate(-0.6deg);
  }

  /* washi tape at the top */
  .album-card::before {
    content: "";
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 90px;
    height: 28px;
    background: rgba(201,166,107,0.55);
    border: 1px solid rgba(201,166,107,0.3);
  }

  .brand { text-align: center; margin-bottom: 30px; }
  .brand .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6E8E82;
    display: block;
    margin-bottom: 6px;
  }
  .brand h1 {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 600;
    font-style: italic;
    color: #3B2A20;
  }
  .brand p {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: #7d6a55;
    margin-top: 2px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 26px;
    border-bottom: 1px solid #e8dcc3;
  }
  .tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 10px 4px 12px;
    color: #a89a83;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    margin-right: 20px;
  }
  .tab.active { color: #D6614A; border-color: #D6614A; font-weight: 500; }

  label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #a89a83;
    margin: 14px 0 6px;
    display: block;
  }
  input {
    width: 100%;
    padding: 11px 4px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    border: none;
    border-bottom: 1.5px solid #e0d3b8;
    background: transparent;
    color: #3B2A20;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #D6614A; }
  input::placeholder { color: #c9bda4; }

  button.primary {
    width: 100%;
    margin-top: 28px;
    padding: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    border: none;
    border-radius: 3px;
    background: #D6614A;
    color: #FFFDF8;
    cursor: pointer;
    box-shadow: 0 3px 0 #b84e39;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button.primary:hover { transform: translateY(1px); box-shadow: 0 2px 0 #b84e39; }
  button.primary:active { transform: translateY(3px); box-shadow: none; }

  .error { color: #b84e39; font-size: 13px; margin-top: 12px; min-height: 16px; font-family: 'IBM Plex Mono', monospace; }
  .success { color: #6E8E82; font-size: 13px; margin-top: 12px; min-height: 16px; font-family: 'IBM Plex Mono', monospace; }

  /* ===== Home screen ===== */
  #homeScreen .album-card { transform: rotate(0.3deg); }

  .home-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .home-header h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 26px;
    font-weight: 600;
  }
  .home-header .logout {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #a89a83;
    cursor: pointer;
    text-decoration: underline;
  }
  .home-sub {
    font-family: 'Caveat', cursive;
    font-size: 16px;
    color: #7d6a55;
    margin-bottom: 24px;
  }

  .memory-grid {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .polaroid {
    background: #FFFDF8;
    padding: 12px 12px 20px;
    box-shadow: 0 6px 14px rgba(59,42,32,0.12);
    cursor: pointer;
    position: relative;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .polaroid:nth-child(odd) { transform: rotate(-1.2deg); }
  .polaroid:nth-child(even) { transform: rotate(1deg); }
  .polaroid:hover {
    transform: rotate(0deg) scale(1.02);
    box-shadow: 0 10px 22px rgba(59,42,32,0.18);
  }

  .polaroid .pin {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e8846f, #b84e39);
    box-shadow: 0 2px 3px rgba(0,0,0,0.3);
  }

  .polaroid .photo-area {
    height: 160px;
    overflow: hidden;
    background: #e8dcc3;
  }
  .polaroid .photo-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .polaroid .caption-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .polaroid .caption {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    color: #3B2A20;
  }
  .polaroid .stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }
  .stamp-ready { background: rgba(110,142,130,0.15); color: #4d6a5f; }
  .stamp-missing { background: rgba(214,97,74,0.12); color: #b84e39; }

  .empty-hint {
    font-family: 'Caveat', cursive;
    font-size: 19px;
    color: #a89a83;
    text-align: center;
    padding: 40px 0;
  }

  /* ===== Scan screen ===== */
  #scanScreen .album-card {
    background: #241d18;
    transform: rotate(0deg);
    text-align: center;
    padding: 32px 28px 36px;
  }
  #scanScreen .album-card::before { display: none; }

  .scan-back {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #a89a83;
    cursor: pointer;
    text-align: left;
    margin-bottom: 20px;
  }

  .viewfinder {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    background: #14100d;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .viewfinder img {
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0.55;
    filter: grayscale(0.3);
  }
  .viewfinder .corner {
    position: absolute;
    width: 26px; height: 26px;
    border-color: #D6614A;
    border-style: solid;
  }
  .corner.tl { top: 10px; left: 10px; border-width: 3px 0 0 3px; }
  .corner.tr { top: 10px; right: 10px; border-width: 3px 3px 0 0; }
  .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 3px 3px; }
  .corner.br { bottom: 10px; right: 10px; border-width: 0 3px 3px 0; }

  #scanScreen h3 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: #F2E8D5;
    font-size: 22px;
    margin-bottom: 6px;
  }
  #scanScreen .scan-hint {
    font-family: 'Caveat', cursive;
    font-size: 17px;
    color: #b8a88f;
    margin-bottom: 26px;
  }

  button.scan-btn {
    width: 100%;
    padding: 14px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 3px;
    background: #D6614A;
    color: #FFFDF8;
    cursor: pointer;
    box-shadow: 0 3px 0 #b84e39;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button.scan-btn:hover { transform: translateY(1px); box-shadow: 0 2px 0 #b84e39; }
  button.scan-btn:active { transform: translateY(3px); box-shadow: none; }

  /* ===== AR Camera Screen ===== */
  #arScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    width: 100vw;
    height: 100dvh;
  }
  #arScreen.active { display: block; }

  #ar-container {
    width: 100%;
    height: 100%;
  }

  .ar-topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
  }
  .ar-close {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #F2E8D5;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(242,232,213,0.3);
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .ar-status {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: #F2E8D5;
    background: rgba(0,0,0,0.5);
    padding: 8px 18px;
    border-radius: 20px;
    z-index: 10;
    text-align: center;
  }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="screen active" id="authScreen">
  <div class="album-card">
    <div class="brand">
      <span class="eyebrow">Est. Today</span>
      <h1>AR Memories</h1>
      <p>where a photo remembers what happened</p>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">Log In</div>
      <div class="tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <div id="loginForm">
      <label>Email</label>
      <input id="loginEmail" placeholder="you@example.com" value="testuser@example.com" />
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Password" value="TestPassword123!" />
      <button class="primary" onclick="login()">Log In</button>
      <div class="error" id="loginError"></div>
    </div>

    <div id="signupForm" style="display:none;">
      <label>Email</label>
      <input id="signupEmail" placeholder="you@example.com" />
      <label>Password</label>
      <input id="signupPassword" type="password" placeholder="Choose a password" />
      <button class="primary" onclick="signup()">Create Account</button>
      <div class="error" id="signupError"></div>
      <div class="success" id="signupSuccess"></div>
    </div>
  </div>
</div>

<!-- HOME SCREEN -->
<div class="screen" id="homeScreen">
    <div class="album-card">
      <div class="home-header">
        <h2>Your Memories</h2>
        <span class="logout" onclick="logout()">Log out</span>
      </div>
      <div class="home-sub">tap a photo to bring it to life</div>
      <div class="memory-grid" id="memories"></div>
    </div>
  </div>

<!-- SCAN SCREEN -->
<div class="screen" id="scanScreen">
    <div class="album-card">
      <div class="scan-back" onclick="goHome()">&larr; back to memories</div>
  
      <div class="viewfinder">
        <img id="scanPhoto" src="" alt="reference photo" />
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
  
      <h3 id="scanCaption"></h3>
      <div class="scan-hint">line up your camera with this photo</div>
      <button class="scan-btn" onclick="startAR()">Start Scan</button>
    </div>
  </div>

<!-- AR CAMERA SCREEN -->
<div id="arScreen">
    <div class="ar-topbar">
      <span class="ar-close" onclick="stopAR()">&times; Close</span>
    </div>
    <div id="ar-container"></div>
    <div class="ar-status" id="arStatus">Point your camera at the photo...</div>
  </div>

<script>
const API_BASE = "http://192.168.3.74:8000";
let accessToken = null;
let selectedMemory = null;

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function switchTab(tab) {
  document.getElementById("tabLogin").classList.toggle("active", tab === "login");
  document.getElementById("tabSignup").classList.toggle("active", tab === "signup");
  document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
  document.getElementById("signupForm").style.display = tab === "signup" ? "block" : "none";
}

async function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  const errorEl = document.getElementById("loginError");
  errorEl.textContent = "";

  const res = await fetch(`${API_BASE}/auth/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });

  if (!res.ok) {
    errorEl.textContent = "Invalid email or password.";
    return;
  }

  const data = await res.json();
  accessToken = data.access_token;
  showScreen("homeScreen");
  loadMemories();
}

async function signup() {
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;
  const errorEl = document.getElementById("signupError");
  const successEl = document.getElementById("signupSuccess");
  errorEl.textContent = "";
  successEl.textContent = "";

  const res = await fetch(`${API_BASE}/auth/signup`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    errorEl.textContent = data.detail || "Signup failed.";
    return;
  }

  successEl.textContent = "Account created! Switching to login...";
  setTimeout(() => {
    switchTab("login");
    document.getElementById("loginEmail").value = email;
    document.getElementById("loginPassword").value = password;
  }, 1200);
}

function logout() {
  accessToken = null;
  selectedMemory = null;
  showScreen("authScreen");
}

function goHome() {
  showScreen("homeScreen");
}

async function loadMemories() {
  const container = document.getElementById("memories");
  container.innerHTML = '<div class="empty-hint">loading your memories...</div>';

  const res = await fetch(`${API_BASE}/memories/`, {
    headers: { Authorization: `Bearer ${accessToken}` },
  });

  if (!res.ok) {
    container.innerHTML = '<div class="empty-hint">couldn\'t load memories</div>';
    return;
  }

  const memories = await res.json();
  container.innerHTML = "";

  if (memories.length === 0) {
    container.innerHTML = '<div class="empty-hint">no memories yet — upload one first</div>';
    return;
  }

  memories.forEach((mem) => {
    const hasMind = !!mem.mind_file_url;
    const div = document.createElement("div");
    div.className = "polaroid";
    div.innerHTML = `
      <div class="pin"></div>
      <div class="photo-area">
        <img src="${mem.photo_url}" alt="${mem.caption || 'memory photo'}" />
      </div>
      <div class="caption-row">
        <span class="caption">${mem.caption || "untitled"}</span>
        <span class="stamp ${hasMind ? "stamp-ready" : "stamp-missing"}">
          ${hasMind ? "ready" : "no scan"}
        </span>
      </div>
    `;
    div.onclick = () => selectMemory(mem);
    container.appendChild(div);
  });
}

function selectMemory(mem) {
  if (!mem.mind_file_url) {
    alert("This memory has no .mind file yet.");
    return;
  }
  selectedMemory = mem;
  document.getElementById("scanCaption").textContent = mem.caption || "Untitled memory";
  document.getElementById("scanPhoto").src = mem.photo_url;
  showScreen("scanScreen");
}
</script>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>
    
    <script type="module">
      import * as THREE from 'three';
      import { MindARThree } from 'mindar-image-three';
    
      let mindarThree = null;
      let videoEl = null;
    
      window.startAR = async function () {
        if (!selectedMemory) return;

        const arScreen = document.getElementById("arScreen");
        arScreen.classList.add("active");
        document.getElementById("arStatus").textContent = "Point your camera at the photo...";

        // wait one frame so the browser finishes layout before MindAR reads container size
        await new Promise(requestAnimationFrame);

        mindarThree = new MindARThree({
            container: document.querySelector("#ar-container"),
            imageTargetSrc: selectedMemory.mind_file_url,
            filterMinCF: 0.0001,
            filterBeta: 10000,
            warmupTolerance: 1,
            missTolerance: 2,
        });
    
        const { renderer, scene, camera } = mindarThree;
    
        videoEl = document.createElement("video");
        videoEl.src = selectedMemory.video_url;
        videoEl.crossOrigin = "anonymous";
        videoEl.loop = true;
        videoEl.muted = false;
        videoEl.playsInline = true;
    
        const texture = new THREE.VideoTexture(videoEl);
        const geometry = new THREE.PlaneGeometry(1, 1.2);
        const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
        const plane = new THREE.Mesh(geometry, material);
    
        const anchor = mindarThree.addAnchor(0);
        anchor.group.add(plane);
    
        anchor.onTargetFound = () => {
          document.getElementById("arStatus").textContent = "Playing memory...";
          videoEl.play();
        };
        anchor.onTargetLost = () => {
          document.getElementById("arStatus").textContent = "Point your camera at the photo...";
          videoEl.pause();
        };
    
        await mindarThree.start();
        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });
      };

      window.addEventListener("resize", () => {
            if (mindarThree) {
                mindarThree.renderer.setSize(window.innerWidth, window.innerHeight);
                mindarThree.camera.aspect = window.innerWidth / window.innerHeight;
                mindarThree.camera.updateProjectionMatrix();
            }
        });
    
      window.stopAR = function () {
        if (videoEl) {
          videoEl.pause();
          videoEl = null;
        }
        if (mindarThree) {
          mindarThree.stop();
          mindarThree.renderer.setAnimationLoop(null);
          mindarThree = null;
        }
        document.getElementById("arScreen").classList.remove("active");
      };
    </script>
</body>
</html>
